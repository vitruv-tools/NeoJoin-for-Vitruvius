name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
    - main
  # The NeoJoin artifacts are snapshots from Maven Central, which change independently of this repository.
  # Same time as the nightly build of NeoJoin, which deploys these snapshots. GitHub delays scheduled runs, so the order of the
  # two builds is not guaranteed: a build may use the snapshot of the previous night.
  schedule:
  - cron: "0 2 * * *"

jobs:
  build-maven:
    name: Build Maven projects
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    # --update-snapshots fetches the latest NeoJoin snapshots (repository from the parent POM tools.vitruv:parent).
    - name: Build projects
      run: >
        ./mvnw clean verify
        --batch-mode
        --fail-at-end
        --update-snapshots
        --no-transfer-progress

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs: build-maven

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    # Checks all modules and reports the violations as errors, but Maven itself does not fail because of them
    # (a failing module would skip the modules that depend on it). The next step fails the job instead.
    # Only the Checkstyle execution runs: the validate phase would also run the enforcer rules, which need the
    # jars of the other modules.
    - name: Check code style
      run: >
        ./mvnw checkstyle:check@validate -P checkstyle
        -Dcheckstyle.severity=error
        -Dcheckstyle.failsOnError=false
        -Dcheckstyle.failOnViolation=false
        --batch-mode
        --fail-at-end
        --update-snapshots
        --no-transfer-progress

    - name: Fail on violations
      run: |
        if grep -rlq --include=checkstyle-result.xml 'severity="error"' .; then
          echo "Checkstyle violations per module:"
          grep -rc --include=checkstyle-result.xml 'severity="error"' . | grep -v ':0$'
          exit 1
        fi

  build-maven-other-platforms:
    name: Build Maven projects
    runs-on: ${{ matrix.os }}
    needs: build-maven
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    - name: Build projects
      run: >
        ./mvnw clean verify
        --batch-mode
        --fail-at-end
        --update-snapshots
        --no-transfer-progress

  sonar:
    name: SonarQube scan of Maven projects
    if: github.event_name == 'schedule' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    needs: build-maven

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Java and Maven cache
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        check-latest: true
        cache: 'maven'

    - name: Setup SonarQube cache
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Analyze projects
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
        ./mvnw clean verify sonar:sonar -P coverage
        --batch-mode
        --update-snapshots
        --no-transfer-progress
        -Dsonar.projectKey=vitruv-tools_NeoJoin-for-Vitruvius
